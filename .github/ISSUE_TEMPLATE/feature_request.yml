name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## Before You Submit
        - Check [existing issues](https://github.com/banter240/homeassistant-delonghi-dehumidifier/issues).

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Concrete use case or limitation.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, API property dumps, model info, etc.
    validations:
      required: false
