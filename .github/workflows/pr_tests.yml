name: PR Tests

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "custom_components/delonghi_dehumidifier_api/**"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "hacs.json"

jobs:
  lint:
    name: "Run Linter"
    uses: ./.github/workflows/lint.yml

  validation:
    name: "Run Validation"
    uses: ./.github/workflows/validate.yml
