# Reusable validation. Custom HACS repo only — not hacs/default.
# Skip hacs/action (requires default-store topics/issues checks).

name: "Validate"

on:
  # This makes the workflow reusable.
  workflow_call:

jobs:
  # Job 1: Run hassfest for Home Assistant core requirements.
  hassfest:
    name: "Hassfest Validation"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v5"

      - name: "Run hassfest validation"
        uses: "home-assistant/actions/hassfest@master"
